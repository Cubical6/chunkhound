name: Fork stable promotion

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA that fork-latest was built from
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    if: github.repository != 'chunkhound/chunkhound'
    runs-on: ubuntu-latest
    environment: fork-stable
    timeout-minutes: 15
    permissions:
      contents: write
    # Separate group so a promotion never cancels a pending publish.
    # Concurrent publishing is safe: asset, manifest-commit and tag checks reject
    # half-updated fork-latest assets (publish uploads the manifest last).
    concurrency:
      group: fork-release-promote
      cancel-in-progress: false
    env:
      # GITHUB_TOKEN events do not trigger upstream release.yml's PyPI publisher.
      # Never replace this with a PAT or GitHub App token.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate expected commit
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'commit must be a full 40-character lowercase hexadecimal SHA' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v3
      - name: Download all rolling release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download fork-latest -R "$GH_REPO" --dir release-assets
      - name: Verify assets and source commit
        run: |
          set -euo pipefail
          cd release-assets
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          manifest = json.loads(Path('manifest.json').read_text())
          require(manifest['schema'] == 1, 'Unsupported manifest schema')
          expected = os.environ['EXPECTED_COMMIT']
          actual = manifest['commit']
          require(actual == expected,
                  f'fork-latest moved since the caller checked: expected {expected}, manifest commit {actual}')
          archives = manifest['archives']
          names = [archive['name'] for archive in archives]
          require(set(names) == {'chunkhound-fork-linux-x86_64.tar', 'chunkhound-fork-macos-x86_64.tar'}
                  and len(names) == 2, 'Unexpected manifest archives')
          wanted = set(names) | {'SHA256SUMS', 'manifest.json'}
          found = {path.name for path in Path('.').iterdir()}
          require(found == wanted,
                  f'Asset set mismatch: missing {sorted(wanted - found)}, unexpected {sorted(found - wanted)}')
          for archive in archives:
              path = Path(archive['name'])
              require(path.is_file(), f'Missing archive: {path}')
              require(path.stat().st_size == archive['size'], f'Size mismatch: {path}')
              require(hashlib.sha256(path.read_bytes()).hexdigest() == archive['sha256'],
                      f'SHA256 mismatch: {path}')
          PY
          sha256sum -c SHA256SUMS
          actual="$(gh api "repos/$GH_REPO/git/ref/tags/fork-latest" --jq '.object.sha')"
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "fork-latest moved since the caller checked: expected $EXPECTED_COMMIT, tag points at $actual" >&2
            exit 1
          fi
          status="$(gh api "repos/$GH_REPO/compare/$EXPECTED_COMMIT...main" --jq '.status')"
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "Commit $EXPECTED_COMMIT is not contained in main (compare status: $status)" >&2
            exit 1
          fi
      - name: Create immutable stable release (manifest last)
        run: |
          set -euo pipefail
          version="$(jq -er '.version | strings | select(length > 0)' release-assets/manifest.json)"
          public_version="${version%%+*}"
          tag="fork-v$public_version"
          git check-ref-format "refs/tags/$tag"
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" |
            jq -r --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref) | .ref')"
          releases="$(gh api --paginate "repos/$GH_REPO/releases")"
          published_id="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == false) | .id' <<< "$releases")"
          if [[ -n "$existing" || -n "$published_id" ]]; then
            echo "Stable tag or published release $tag already exists; immutable releases cannot be replaced" >&2
            exit 1
          fi
          draft_ids="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == true) | .id' <<< "$releases")"
          for id in $draft_ids; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
          stable_tag=''
          stable_sha=''
          if gh api "repos/$GH_REPO/releases/latest" > previous-release.json 2> previous-release.err; then
            stable_tag="$(jq -r '.tag_name | select(startswith("fork-v"))' previous-release.json)"
          elif ! grep -q 'HTTP 404' previous-release.err; then
            head -c 2000 previous-release.err >&2
            exit 1
          fi
          if [[ -n "$stable_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$stable_tag"
            stable_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          fi
          run_url="$(jq -r '.run_url' release-assets/manifest.json)"
          uv run --no-project --python 3.12 python scripts/fork_release_notes.py --channel stable --version "$version" --commit "$EXPECTED_COMMIT" \
            --previous "$stable_sha" --previous-name "$stable_tag" --run-url "$run_url" > release-notes.txt
          # Drafts have no tag and can be replaced safely after a failed upload.
          gh release create "$tag" -R "$GH_REPO" --draft --target "$EXPECTED_COMMIT" \
            --title "Fork stable $public_version" --notes-file release-notes.txt
          gh release upload "$tag" -R "$GH_REPO" release-assets/*.tar release-assets/SHA256SUMS
          gh release upload "$tag" -R "$GH_REPO" release-assets/manifest.json
          gh release edit "$tag" -R "$GH_REPO" --draft=false --prerelease=false --latest
          object="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object')"
          while [[ "$(jq -r '.type' <<< "$object")" == tag ]]; do
            sha="$(jq -r '.sha' <<< "$object")"
            object="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object')"
          done
          actual="$(jq -r '.sha' <<< "$object")"
          if [[ "$(jq -r '.type' <<< "$object")" != commit || "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "ERROR: Published stable tag $tag does not point at expected commit $EXPECTED_COMMIT (resolved object: $object)" >&2
            exit 1
          fi
